<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MemoryLink</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FDFDFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1C1B1A;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #1C1B1A;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-weight: 500;
      margin: 0;
      font-size: 1.2rem;
    }
    p {
      color: #888;
      font-size: 0.9rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>MemoryLink is starting...</h2>
  <p>Booting up the internal knowledge server</p>
</body>
</html>
